[workspace]
members = ["wasm"]

[package]
name = "objscript"
version = "1.2.0"
edition = "2021"

[features]
default = ["cli"]
cli = ["dep:ureq"]

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", optional = true }

[[bin]]
name = "objscript"
path = "src/main.rs"
required-features = ["cli"]